---
- name: Deploy Node.js App
  hosts: all
  become: yes

  tasks:
    - name: Setup Node.js repository
      shell: "curl -fsSL https://deb.nodesource.com/setup_16.x | sudo -E bash -"

    - name: Install Node.js
      apt:
        name: nodejs
        state: present
        update_cache: yes

    - name: Create app directory
      file:
        path: /home/ubuntu/app
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    - name: Create a simple Node.js app file
      copy:
        dest: /home/ubuntu/app/index.js
        content: |
          const http = require('http');
          const port = 3000;
          const server = http.createServer((req, res) => {
            res.statusCode = 200;
            res.setHeader('Content-Type', 'text/plain');
            res.end('Hello from Ansible! App is running successfully.\n');
          });
          server.listen(port, () => {
            console.log(`Server running at port ${port}`);
          });
        owner: ubuntu
        group: ubuntu
        mode: '0644'

    - name: Start the Node.js application
      shell: "nohup node /home/ubuntu/app/index.js > /home/ubuntu/app/app.log 2>&1 &"
      async: 10
      poll: 0
